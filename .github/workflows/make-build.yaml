name: make-build

on:
  push:
    branches: [dev, mc]
  workflow_dispatch:

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.arch }} ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build (Make)
      if: runner.os != 'Windows'
      # test-bins only builds the binaries scripts/run_tests.py needs (it does not run
      # them, and does not pull in GNUmakefile's own c2m C-tests/bootstrap recipes --
      # run_tests.py runs that same broad suite itself in the step below).
      run: make -C src test-bins
    - name: Set up MSVC dev environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    - name: Build (CMake)
      if: runner.os == 'Windows'
      run: |
        cmake -S src -B build -A x64 -DBUILD_TESTING=ON
        cmake --build build --config Release
    # scripts/run_tests.py is the single, canonical test orchestrator: it runs the
    # same broad suite on all 3 platforms against whichever build dir this OS's build
    # step produced (make builds in-place under src/; CMake builds under build/).
    - name: Run Tests (Python)
      if: runner.os != 'Windows'
      run: python3 scripts/run_tests.py --build-dir src
    - name: Run Tests (Python)
      if: runner.os == 'Windows'
      run: python scripts/run_tests.py --build-dir build
