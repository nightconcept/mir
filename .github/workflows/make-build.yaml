name: make-build

on:
  push:
    branches: [dev, mc]
  workflow_dispatch:

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.arch }} ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Run Tests (Make)
      if: runner.os != 'Windows'
      run: make -C src test
    - name: Set up MSVC dev environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    - name: Run Tests (CMake)
      if: runner.os == 'Windows'
      run: |
        cmake -S src -B build -A x64 -DBUILD_TESTING=ON
        cmake --build build --config Release
        python scripts/run_tests.py --build-dir build
