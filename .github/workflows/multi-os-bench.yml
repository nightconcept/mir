name: multi-os-bench

on: [workflow_dispatch]
#  schedule:
#    # Run at 18:00 UTC on Wednesday
#    - cron:  '00 18 * * 3'

jobs:
  bench:

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.arch }} ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: make bench
      run: make bench
