name: zig-build

on:
  push:
    branches: [dev, mc]
  workflow_dispatch:

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.arch }} ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: "0.16.0"
    - name: Check Test Manifest Matches GNUmakefile
      if: runner.os != 'Windows'
      run: python3 scripts/check-test-manifest.py
    - name: Run Tests
      run: zig build test
